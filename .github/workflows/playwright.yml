name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.Azure_Credential }}

    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
      run: npx playwright test --config=playwright.service.config.js --workers=4

    - name: Upload Report to Azure Storage
      if: always()
      run: |
        az storage blob upload-batch \
          --account-name pwstrgtestgroupb9c4 \
          --auth-mode login \
          --destination '$web' \
          --source playwright-report/ \
          --overwrite true

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
